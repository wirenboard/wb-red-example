# Дополнение к keepalived.conf для проверки реплики. Нужно только при включённой
# репликации состояния. Без скрипта /usr/local/bin/wb-ha-replica-gate.sh не добавляйте:
# из-за init_fail узел останется с пониженным приоритетом.
#
# 1. Вставьте блок vrrp_script ниже в /etc/keepalived/keepalived.conf перед vrrp_instance.
# 2. Добавьте строку chk_replica_fresh в блок track_script внутри vrrp_instance.
#
#     track_script {
#         chk_wb_automation
#         chk_replica_fresh
#     }
vrrp_script chk_replica_fresh {
    script "/usr/local/bin/wb-ha-replica-gate.sh"
    interval 1
    weight -60
    fall 1
    rise 2
    init_fail
}
